backend:
  name: git-gateway
  branch: main

media_folder: "img"
public_folder: "img"

collections:
  - name: "pages"
    label: "Website Pages"
    files:
      - file: "index.html"
        label: "Home Page Settings"
        name: "home"
        fields:
          - {label: "CEO Name", name: "ceo_name", widget: "string"}
          - {label: "CEO Message", name: "ceo_message", widget: "text"}
          - {label: "CEO Picture", name: "ceo_image", widget: "image"}

  - name: "products"
    label: "Mobile Items"
    folder: "content/products"
    create: true
    fields:
      - {label: "Mobile Name", name: "title", widget: "string"}
      - {label: "Rate / Price", name: "price", widget: "string"}
      - {label: "Product Image", name: "image", widget: "image"}
      - {label: "Description", name: "description", widget: "text"}
